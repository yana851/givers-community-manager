  async function openSession(session){

  async function save(next,mode='edit'){
    if(busy||fetching){notify('処理中です。少し待ってから保存してください。',true);return false;}
    if(!staff||staff.role==='viewer'){notify('編集権限がありません。',true);return false;}
    const token=generation;lock(true);
    try{
      Core.validate(next);const changes=[];
      for(const k of kinds){
        const seen=new Set();for(const r of next[k]){
          const id=rowId(k,r),data=toWire(k,r);seen.add(id);
          if(!baseline[k].has(id))changes.push({kind:k,op:'insert',id,data});
          else if(JSON.stringify(data)!==JSON.stringify(baseline[k].get(id)))changes.push({kind:k,op:'update',id,data,version:versions[k].get(id)});
        }
        for(const id of baseline[k].keys())if(!seen.has(id))changes.push({kind:k,op:'delete',id,version:versions[k].get(id)});
      }
      if(changes.length>5000)throw Error('1回に変更できるのは5,000件までです。CSVを分けて取り込んでください。');
      const data=await rpc('givers_apply_changes_v2',{p_revision:rawSnapshot,p_changes:changes,p_sequences:next.sequences,p_mode:mode});
      if(token!==generation)return false;adopt(data);return true;
    }catch(e){
      if(token!==generation)return false;
      if(e?.code==='42501'){storageError=message(e);await checkPermissionAfterFailure();}
      else storageError=message(e);
      notify('保存を確認できませんでした。'+message(e),true);paint();return false;
    }finally{if(token===generation)lock(false);}
  }

  if(await commit(plan.next,'bulk')){const added=plan.summaries.reduce((n,s)=>n+s.added,0),updated=plan.summaries.reduce((n,s)=>n+s.updated,0),skipped=plan.summaries.reduce((n,s)=>n+s.skipped,0);closeModal();render();notify(`4種類を一括保存しました。${added}件追加、${updated}件更新、${skipped}件スキップ。`);}else $('#apply-backup').disabled=false;
 };
}

function help(){showModal('使い方・CSV仕様',`<div class="help-content"><h3>はじめに</h3><ol><li>購入履歴でBASE注文CSVを取り込みます。会員はメールアドレス、イベントは商品IDで重複判定し、未登録なら追加します。</li><li>新規会員の入会日は注文日、初期状態は「有効」です。同じメールの注文が複数ある場合、新規会員には今回のCSV内の最も古い注文日を使用します。既存会員は上書きしません。</li><li>イベントは商品名で仮登録します。開催日時・参加費・定員を後から入力し、状態を変更してください。</li><li>参加履歴で「購入履歴から申込者を同期」を押し、当日の参加状況を更新します。</li></ol><h3>1つのCSVで一括バックアップ</h3><p><strong>一括エクスポート（CSV）</strong>で、会員・イベント・購入・参加を「種別」列で区別した1つのCSVを保存します。<strong>一括インポート（CSV）</strong>で読み込み、4種類の検証・件数確認後にまとめて保存できます。全体20MB・各種別50,000行まで。該当しない項目は空欄です。見出しとCSV形式列は変更しないでください。<br>単一CSVの採番は、現在の保存データと取り込んだIDから続けます。別ブラウザへ削除済み番号の採番履歴も移す場合はZIP方式を使用してください。</p><h3>ZIPによる一括バックアップ・復元</h3><p>各画面上部の<strong>一括エクスポート（ZIP）</strong>で、4種類のCSVをまとめて保存できます。<strong>一括インポート（ZIP）</strong>でZIPを1回選択すると、4種類をすべて検証し、件数を確認してから一度に保存します。エラーがあればどの台帳も変更しません。<br>ZIPには members.csv、events.csv、purchases.csv、participations.csv と、自動採番を維持する backup-info.json が含まれます。0件の台帳も必要です。ファイル名や採番情報は変更しないでください。<br>個別CSVの入出力も引き続き使用できます。</p><p style="margin-top:8px">会員・イベントは同じID、参加履歴は同じ注文ID＋商品IDを更新、購入履歴は同じ注文IDをスキップします。CSVにない既存データは削除しません。ExcelでCSVを開く際はID列を文字列として取り込み、先頭の0や長い注文IDを保持してください。</p><h3>BASE CSVの必要な列</h3><p><code>注文ID</code> <code>注文日時</code> <code>氏(請求先)</code> <code>名(請求先)</code> <code>合計金額</code> <code>メールアドレス(請求先)</code> <code>商品ID</code> <code>商品名</code></p><p style="margin-top:8px">同じ注文IDの複数明細は1注文にまとめ、合計金額を1回だけ加算します。同じ注文の合計金額・日時・購入者が異なる場合は全体の取り込みを停止します。列名は上記と一致させてください。</p><h3>自動照合と集計のルール</h3><ul><li>メールは前後の空白と大文字・小文字を除いて比較します。メールアドレスとBASE商品IDはそれぞれ台帳内で重複登録できません。</li><li>BASE CSVに含まれる未登録の商品IDごとにイベントを仮登録します。複数商品を含む注文も商品ごとに照合します。住所・電話番号・配送情報・支払方法・注文メモなどは保存しません。</li><li>参加履歴は注文IDと商品IDの組につき1件です。数量による複数人参加には対応していません。</li><li>申込人数はキャンセル・欠席を含む全参加履歴の件数です。残席数は定員から申込人数を引きます。参加人数・参加回数は「参加済」のみです。</li><li>売上は取り込んだ全注文の合計金額です。返金・注文キャンセルによる売上の減算は行いません。</li><li>会員・イベントを削除しても関連履歴は残ります。イベント情報の変更で既存注文の紐付けが変わった場合、参加状況は保持して関連情報を再照合します。</li></ul><h3>オンライン保存について</h3><p>データはオンラインで共有します。保存中・保存済み・未保存は画面上部で確認できます。参加履歴の備考は入力欄から移動した時に保存します。通信エラー時は入力を保持します。別の更新があった場合は、入力を控えてから「最新データ」を押し、やり直してください。編集中の内容は自動で置き換えません。</p><p>会員情報はブラウザ内に保存しません。ログイン情報はタブ単位で保持します。共有端末では利用後にログアウトしてください。日時は日本時間です。一括取り込み・出力と削除は管理者のみ利用できます。CSV/ZIPは1回あたり変更5,000件までです。大きいファイルは個別CSVに分けてください。</p><h3>アカウント</h3><p>右上の「アカウント」からパスワードを変更できます。パスワードを忘れた場合は管理者に連絡してください。招待メール・再設定メールの利用は送信設定後に対応します。</p><h3>ファイル形式</h3><p>UTF-8（BOM付き）で出力し、UTF-8 / Shift_JISで取り込めます。カンマ・引用符・備考の改行を保持します。出力の<code>CSV形式</code>列と購入履歴の<code>商品ID</code>列は復元に使うため変更しないでください。表計算ソフトの数式として解釈される文字列には保護用のアポストロフィを付与し、再取り込み時に元に戻します。</p></div>`,`<button class="btn primary" data-action="close">閉じる</button>`);}
document.addEventListener('click',async e=>{const target=e.target.closest('[data-action],[data-page]');if(!target)return;if(target.dataset.page){go(target.dataset.page);return;}const a=target.dataset.action,id=target.dataset.id;if(a==='bulk-csv-export')exportUnifiedCSV();else if(a==='bulk-csv-import')backupImportModal('csv');else if(a==='bulk-export')exportBackup();else if(a==='bulk-import')backupImportModal();else if(a==='close')closeModal();else if(a==='help')help();else if(a==='add-member')editModal('members');else if(a==='add-event')editModal('events');else if(a==='add')editModal(page);else if(a==='edit')editModal(page,id);else if(a==='delete')deleteModal(id);else if(a==='export'){download(`GIVERS_${page}_${today()}.csv`,Core.exportCSV(state,page));notify('全'+state[page].length+'件をCSVでエクスポートしました。');}else if(a==='template')template(page);else if(a==='import')importModal();else if(a==='sync'){const next=Core.clone(state);Core.reconcile(next);const n=Core.sync(next);if(!n){notify('新しく同期できる注文はありません。イベントのBASE商品IDと購入履歴をご確認ください。');return;}if(await commit(next)){render();notify(n+'件の申込者を同期しました。');}}else if(a==='prev'||a==='next'){pageIndex+=a==='prev'?-1:1;renderTable();}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search'){query=el.value;pageIndex=0;renderTable();}else if(el.dataset.order&&el.dataset.field==='notes')Cloud.draft(el);});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='status-filter'){filter=el.value;pageIndex=0;renderTable();}else if(el.id==='event-filter'){eventFilter=el.value;pageIndex=0;renderTable();}else if(el.dataset.order){Cloud.draft(el);await Cloud.saveDrafts();}});
$('#modal').addEventListener('cancel',e=>{if(Cloud.busy){e.preventDefault();return;}importGeneration++;importPlan=null;});
// Session and data changes are handled by Supabase.
for(const el of document.querySelectorAll('[data-icon]'))el.innerHTML=icon(el.dataset.icon);
function historyDeleteButton(id,label=id){return `<button class="icon-btn delete" data-action="history-delete" data-id="${esc(id)}" aria-label="${esc(label)}を削除">${icon('trash')}</button>`;}
function historyDeleteModal(id){
  const kind=page,item=state[kind]?.find(r=>Core.rowKey(kind,r)===id),revision=rawSnapshot;
  if(!item||!['purchases','participations'].includes(kind))return;
  const note=kind==='purchases'?'同じ注文の参加履歴は残ります。削除した注文をCSVで再び取り込むと、購入履歴が再登録されます。':'購入履歴は残ります。「購入履歴から申込者を同期」を実行すると、この参加履歴が再作成される場合があります。';
  showModal('履歴を1件削除',`<p><strong>${esc(item.name)}</strong>（注文ID：${esc(item.orderId)}${kind==='participations'?'／商品ID：'+esc(item.productId||'旧履歴・未設定'):''}）の${PAGES[kind][0]}を削除します。</p><p class="small muted" style="margin-top:12px">${note}</p><p class="danger-text small" style="margin-top:12px">この操作は元に戻せません。必要な場合は先にCSVを保存してください。</p>`,`<button class="btn" data-action="close">キャンセル</button><button class="btn danger" id="confirm-history-delete">削除する</button>`);
  $('#confirm-history-delete').onclick=async()=>{
    if(revision!==rawSnapshot){notify('最新データを読み込み、削除内容を確認し直してください。',true);return;}
    const next=Core.clone(state);next[kind]=next[kind].filter(r=>Core.rowKey(kind,r)!==id);
    if(await commit(next)){closeModal();render();notify('履歴を1件削除しました。');}
  };
}
function historyResetModal(){
  const revision=rawSnapshot;
  showModal('履歴の一括リセット',`<p>検索・絞り込みに関係なく、選んだ履歴の<strong>全件</strong>を削除します。会員台帳・イベント台帳は残ります。</p><label class="field" style="margin-top:18px">削除する履歴<select id="reset-kind"><option value="purchases" ${page==='purchases'?'selected':''}>購入履歴だけ（${fmt(state.purchases.length)}件）</option><option value="participations" ${page==='participations'?'selected':''}>参加履歴だけ（${fmt(state.participations.length)}件）</option><option value="both">購入履歴と参加履歴の両方（${fmt(state.purchases.length+state.participations.length)}件）</option></select></label><p id="reset-detail" class="small muted" style="margin-top:12px"></p><p class="danger-text small" style="margin-top:12px">この操作は元に戻せません。必要な場合は先に一括エクスポートでバックアップを保存してください。</p><label class="field" style="margin-top:18px">確認のため「リセット」と入力<input id="reset-confirmation" autocomplete="off" placeholder="リセット"></label>`,`<button class="btn" data-action="close">キャンセル</button><button class="btn danger" id="confirm-history-reset" disabled>全件を削除する</button>`);
  const update=()=>{const kind=$('#reset-kind').value,count=kind==='both'?state.purchases.length+state.participations.length:state[kind].length;$('#reset-detail').textContent=kind==='purchases'?'参加履歴は残ります。購入履歴に基づく購入回数・購入金額の集計は0になります。':kind==='participations'?'購入履歴は残ります。「購入履歴から申込者を同期」を実行すると参加履歴が再作成される場合があります。':'購入・参加の履歴と、それらに基づく集計をリセットします。';$('#confirm-history-reset').disabled=count===0||$('#reset-confirmation').value!=='リセット';};
  $('#reset-kind').onchange=()=>{$('#reset-confirmation').value='';update();};$('#reset-confirmation').oninput=update;update();
  $('#confirm-history-reset').onclick=async()=>{
    if($('#reset-confirmation').value!=='リセット')return;
    if(await Cloud.resetHistory($('#reset-kind').value,revision)){closeModal();render();notify('選択した履歴をリセットしました。');}
  };
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='history-delete')historyDeleteModal(el.dataset.id);else if(el.dataset.action==='history-reset')historyResetModal();});

Cloud.boot();
</script>
